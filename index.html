  <!-- primeira pintura: o fundo já na cor certa e o hero no lugar, com a névoa da foto. A folha do site vem em <link>
       (segura a pintura até chegar), nunca pelo JS. O que entra por marco só se esconde com o JS no ar (classe .js);
       se ele não subir em 4 s, a trava cai e a página aparece inteira.
       ?tema= pele (padrão), rosa, oliva, noite -->
  <script>
    (function () {
      var d = document.documentElement, q = new URLSearchParams(location.search);
      d.classList.add('js');
      var tema = q.get('tema');
      if (tema && /^(rosa|oliva|noite)$/.test(tema)) d.dataset.tema = tema;
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) d.classList.add('reduzido');
      if (matchMedia('(hover: none)').matches) d.classList.add('toque');
      setTimeout(function () { if (!window.__tonaViva) d.classList.remove('js'); }, 4000);
    })();
  </script>
