  <title>Lucas Sand | DJ Open Format e Eventos</title>

  <meta name="theme-color" content="#170610">
  <link rel="icon" href="/marca.svg" type="image/svg+xml">
  <!-- primeira pintura: o fundo já na cor certa e o hero no lugar, com a névoa da foto. A folha do site vem em <link>
       (segura a pintura até chegar), nunca pelo JS. O que entra por marco só se esconde com o JS no ar (classe .js);
       se ele não subir em 4 s, a trava cai e a página aparece inteira.
       ?tema= pele (padrão), rosa, oliva, noite -->
  <script>
    (function () {
      var d = document.documentElement, q = new URLSearchParams(location.search);
      d.classList.add('js');
      var tema = q.get('tema');
      if (tema && /^(rosa|oliva|noite)$/.test(tema)) d.dataset.tema = tema;
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) d.classList.add('reduzido');
      if (matchMedia('(hover: none)').matches) d.classList.add('toque');
      setTimeout(function () { if (!window.__tonaViva) d.classList.remove('js'); }, 4000);
    })();
  </script>
  <style>
    html { background: #170610; color: #fff3f6; }
    body { margin: 0; }
    html:not(.assentou) *, html:not(.assentou) *::before, html:not(.assentou) *::after { transition: none !important; }
  </style>
  <!-- as duas fontes da primeira tela chegam junto com a folha, para a marca não piscar em outra letra -->
  <link rel="preload" href="/node_modules/@fontsource/shrikhand/files/shrikhand-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/node_modules/@fontsource-variable/dm-sans/files/dm-sans-latin-opsz-normal.woff2" as="font" type="font/woff2" crossorigin>
